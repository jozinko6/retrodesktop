[package]
name = "retrobox-desktop"
version = "0.1.0"
description = "Local Windows big-picture emulator launcher"
authors = ["RetroBox contributors"]
license = "MIT"
repository = "https://github.com/jozinko6/retrobox-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "retrobox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
sysinfo = "0.33"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
